name: Backend CI

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tezkassa
          POSTGRES_PASSWORD: tezkassa
          POSTGRES_DB: tezkassa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tezkassa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true # style issues should not block the pipeline, only surface them

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://tezkassa:tezkassa@localhost:5432/tezkassa_test
          JWT_ACCESS_SECRET: ci-test-access-secret-0123456789abcdef0123456789
          JWT_REFRESH_SECRET: ci-test-refresh-secret-0123456789abcdef0123456789
          CLICK_MODE: mock
          CLICK_CREDENTIALS_KEK: 00112233445566778899aabbccddeeff00112233445566778899aabbccddee
        run: npm run migrate:up

      - name: Run tests
        env:
          DATABASE_URL: postgres://tezkassa:tezkassa@localhost:5432/tezkassa_test
          JWT_ACCESS_SECRET: ci-test-access-secret-0123456789abcdef0123456789
          JWT_REFRESH_SECRET: ci-test-refresh-secret-0123456789abcdef0123456789
          CLICK_MODE: mock
          CLICK_CREDENTIALS_KEK: 00112233445566778899aabbccddeeff00112233445566778899aabbccddee
          TELEGRAM_ENABLED: "false"
        run: npm test

      - name: Build
        run: npm run build

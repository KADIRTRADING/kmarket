# Local development stack: PostgreSQL + backend API.
# Usage: docker compose -f docker-compose.dev.yml up -d
# See docs/local-setup.md for the full walkthrough.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tezkassa
      POSTGRES_PASSWORD: tezkassa
      POSTGRES_DB: tezkassa
    ports:
      - "5432:5432"
    volumes:
      - tezkassa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tezkassa"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://tezkassa:tezkassa@db:5432/tezkassa
      JWT_ACCESS_SECRET: dev-only-access-secret-do-not-use-in-production-0123456789
      JWT_REFRESH_SECRET: dev-only-refresh-secret-do-not-use-in-production-0123456789
      CLICK_MODE: mock
      CLICK_CREDENTIALS_KEK: 00112233445566778899aabbccddeeff00112233445566778899aabbccddee
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

volumes:
  tezkassa_db_data:
